name: 🐛 Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Before
        submitting, please search existing [issues](https://github.com/ASH-SuperUser/tlsotp/issues)
        to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour, ideally with a minimal code snippet.
      placeholder: |
        from tlsotp import get_OTP
        otp = get_OTP(main_key="...", ...)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any traceback or error output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tlsotp version
      description: What version of `tlsotp` are you using? (e.g. `1.0.0` — check with `tlsotp.__version__`)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      description: Which Python version are you using?
      options:
        - "3.8"
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Which operating system are you on?
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant information (screenshots, related issues, etc.).
