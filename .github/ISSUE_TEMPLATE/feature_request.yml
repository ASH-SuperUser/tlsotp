name: ✨ Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check existing
        [issues](https://github.com/ASH-SuperUser/tlsotp/issues) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Is your feature request related to a problem? Describe it clearly.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: api
    attributes:
      label: Suggested API
      description: |
        If applicable, show what the new function/parameter might look like.
        Remember TLSOTP is stdlib-only and aims for a small, stable API.
      placeholder: |
        def get_OTP(..., new_param=...):
            ...
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
